<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Pagamento confirmado</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; display: grid; place-items: center; min-height: 100vh; color: #0f172a; }
    .card { background: #fff; border-radius: 18px; padding: 32px; max-width: 520px; width: calc(100% - 32px); box-shadow: 0 18px 50px rgba(15,23,42,.12); }
    h1 { margin-top: 0; color: #166534; }
    p { line-height: 1.6; color: #334155; }
    a { display: inline-block; margin-top: 16px; background: #1976d2; color: #fff; padding: 12px 18px; border-radius: 12px; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✅ Pagamento confirmado</h1>
    <p id="message">Validando seu pagamento...</p>
    <a id="backLink" href="/">Voltar para o site</a>
  </div>
  <script>
    const API_BASE = (location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin || '');
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get('bookingId');
    const message = document.getElementById('message');
    const backLink = document.getElementById('backLink');

    if (!bookingId) {
      message.textContent = 'Não foi possível localizar o agendamento após o pagamento.';
      backLink.href = '/';
      return;
    }

    fetch(`${API_BASE}/api/booking-status?bookingId=${encodeURIComponent(bookingId)}`)
      .then(async (response) => {
        const data = await response.json();
        if (!response.ok || data.status !== 'approved') {
          message.textContent = 'O pagamento foi enviado, mas ainda está sendo validado pelo Mercado Pago. Aguarde alguns segundos e volte para essa página.';
          return;
        }

        message.textContent = 'Pagamento aprovado. Seu agendamento foi liberado.';
        backLink.href = `/?paid=1&bookingId=${encodeURIComponent(bookingId)}`;
        setTimeout(() => {
          window.location.href = backLink.href;
        }, 1800);
      })
      .catch(() => {
        message.textContent = 'Não foi possível confirmar o pagamento agora. Tente novamente em alguns instantes.';
      });
  </script>
</body>
</html>
